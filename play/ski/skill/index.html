<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112a4b"><title>风口下山 · 极夜峡湾</title><link rel="stylesheet" href="./fjord.css">
</head><body>
<main id="slope" aria-label="风口下山滑雪游戏">
 <canvas id="landscape" aria-hidden="true"></canvas>
 <div id="run" hidden>
  <header class="instruments">
   <div class="odometer" aria-label="滑行距离"><span class="label">滑行距离</span><div><strong id="distance">000</strong><span class="unit"> / 460 m</span></div></div>
   <div class="right"><span class="bells" aria-label="收集的铜铃"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5c0-3 4-3 4 0M5 17c3-4 1-9 5-11 4-2 8 2 8 6v3l2 2z"/><path d="M10 20h4"/></svg><b id="bells">0</b></span><button id="pause" class="icon" aria-label="暂停" title="暂停（P）" data-act="pause"><span></span><span></span></button></div>
  </header>
 </div>
 <section id="panel" class="panel" aria-labelledby="title">
  <div id="intro-name"><span class="route-mark" aria-hidden="true"></span>极夜峡湾</div>
  <h1 id="title">风口下山</h1>
  <p id="explain">跃过岩石，赶在雪崩前抵达山口。</p>
  <button id="main-action" class="primary" data-act="start">出发 <i aria-hidden="true">→</i></button>
  <p id="controls">轻点起跳，长按后空翻。空格键同样可用。</p>
 </section>
 <footer id="approach" aria-label="后方雪崩距离" hidden><div class="approach-name"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="m0 13 7-11 5 7 3-4 9 12H0zm7-9-3 5 3-2 2 1z" fill="currentColor" fill-rule="evenodd"/></svg>后方雪崩</div><div class="range"><span id="gap">31</span><small> m</small></div><div class="scale" aria-hidden="true"><i id="needle"></i></div></footer>
 <div id="feedback" role="status" aria-live="polite"></div>
</main><script type="module" src="./fjord.mjs"></script></body></html>
