<!doctype html>
<html lang="zh-CN" data-skin="alpenglow">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ece1c9" />
    <title>雪线晨光 · 滑雪跳跃</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../ski.css" />
    <link rel="preload" as="image" href="../art/first-light.webp" />
    <script defer src="../course.js"></script>
    <script defer src="../scene.js"></script>
    <script defer src="../ski.js"></script>
  </head>
  <body>
    <main class="playfield" aria-label="雪线晨光">
      <canvas id="scene" aria-label="侧视滑雪道，按住蓄力，松开起跳"></canvas>
      <header class="bar">
        <div class="brand">
          <svg viewBox="0 0 42 38" aria-hidden="true">
            <path
              d="M3 30 17 9l5 8 5-10 12 23z"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linejoin="round"
            />
            <path
              d="m10 20 6 2 3-6m3 1 4 5 4-2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
          <div><strong>雪线晨光</strong><small>FIRST LIGHT</small></div>
        </div>
        <nav>
          <a href="../classic/" aria-label="切换到基础版"
            >基础版<span aria-hidden="true"> ↗</span></a
          ><button
            id="sound"
            aria-label="开启声音"
            aria-pressed="false"
          ></button
          ><button id="pause" aria-label="暂停" disabled></button>
        </nav>
      </header>
      <div class="metrics">
        <div class="distance"><span id="distance">0</span><small>m</small></div>
        <div class="gates">
          <svg viewBox="0 0 24 22" aria-hidden="true">
            <path
              d="M5 20V2m1 1c4-3 7 3 13 0l-2 7c-6 2-8-4-11-1"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg
          ><b id="cleared">0</b><small>/ 10</small>
        </div>
      </div>
      <div class="hero" aria-hidden="true">
        <span>阿尔卑斯 · 晨光线</span>
        <div>First Light</div>
      </div>
      <div class="cue" id="cue" aria-live="polite"></div>
      <footer class="deck">
        <div class="route">
          <span>起点</span><canvas id="profile" aria-label="赛道进度"></canvas
          ><span>终点</span>
        </div>
        <button class="jump" id="jump" aria-label="按住蓄力，松开起跳">
          <span class="jump-icon" aria-hidden="true"
            ><svg viewBox="0 0 48 44">
              <path
                d="M4 34c11 2 16-3 24-11m-18 17c11 1 17-4 24-11M18 24l7-7-8-2 7-8 7 8 6-1m-12 3-4 9"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="29" cy="6" r="3.5" fill="currentColor" /></svg></span
          ><span class="action-words"
            ><b id="action">按住蓄力</b><small id="hint">松开起跳</small></span
          ><span class="power" aria-hidden="true"
            ><i></i><i></i><i></i><i></i><i></i
          ></span>
        </button>
      </footer>
      <section
        id="overlay"
        class="overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
        hidden
      >
        <div class="ticket">
          <span class="ticket-icon" aria-hidden="true"></span>
          <h1 id="dialog-title"></h1>
          <p id="detail"></p>
          <button id="main-action"></button><button id="secondary"></button>
        </div>
      </section>
    </main>
  </body>
</html>
