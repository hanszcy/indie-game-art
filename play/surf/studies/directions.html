<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冲浪造型比较</title><style>body{background:#e8dfc9;color:#183c50;font:14px sans-serif;margin:24px}h1{font-size:22px}main{display:flex;gap:24px}figure{margin:0;width:360px}canvas{width:360px;height:640px}figcaption{margin:12px 0;line-height:1.8}</style><h1>同一浪道 · 两种画法</h1><main><figure><canvas id="cut" width="720" height="1280"></canvas><figcaption>A · 回钩浪、分叉浪沫，屈膝的宽袖浪客。身体重心向板面收拢。</figcaption></figure><figure><canvas id="line" width="720" height="1280"></canvas><figcaption>B · 连续弧线、细长浪丝，伸展的长肢人物。身体与浪线同向展开。</figcaption></figure></main><script type="module">import {SurfRun} from '../shared/engine.js';import {render} from '../skill/art.js';let g=new SurfRun();g.x=520;g.y=(await import('../shared/engine.js')).water(g.x,0);for(const v of ['cut','line']){const c=document.getElementById(v).getContext('2d');c.scale(2,2);render(c,360,640,g,[],{variant:v,study:true})}</script></html>
