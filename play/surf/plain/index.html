<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f50"><title>浪间一日 · 浮世绘冲浪</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="浪间一日，浮世绘冲浪游戏"><canvas id="scene" aria-label="冲浪场景"></canvas><header class="masthead"><a href="../index.html" aria-label="返回版本选择">‹ 返回</a><span>浪間一日 <i>・</i> 普通版</span><button id="pause" aria-label="暂停游戏">Ⅱ</button></header><section class="hud" aria-label="游戏状态"><div><span class="eyebrow">海岸航程</span><strong><b id="distance">0</b><small> / 800 米</small></strong></div><div class="hud-right"><span id="health" aria-label="体力3">● ● ●</span><strong class="shell-count">◉ <b id="shells">0</b><small> 海螺</small></strong></div></section><div class="progress"><i id="progress"></i></div><div id="announcement" aria-live="polite"></div><section id="intro" class="panel"><span class="kicker">波に乗る · A DAY ON THE WAVES</span><h1>浪间一日</h1><p>沿着靛蓝海岸，逐浪八百米。<br>越过礁石与漂木，拾起浪花中的海螺。</p><div class="instruction"><span>① 按住蓄力</span><span>② 松开起跃</span></div><button id="start" class="primary">开始逐浪 <span>→</span></button><small class="support">轻点小跳 · 长按高跳 · 碰撞三次结束</small></section><section id="dialog" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span id="dialog-kicker" class="kicker">休息片刻</span><h2 id="dialog-title">把时间交给海风</h2><p id="dialog-copy">浪潮会等你，准备好再出发。</p><div id="result-stats" class="result-stats hidden"></div><button id="resume" class="primary">继续逐浪 →</button><button id="restart" class="secondary">重新开始</button><a class="text-link" href="../index.html">返回版本选择</a></section><footer class="controls"><div class="control-caption"><span id="control-hint">按住蓄力，松开跳跃</span><span id="charge-label">海风正好</span></div><button id="jump" aria-label="按住蓄力，松开跳跃"><span class="jump-label">跃浪 <span>↗</span></span><span class="jump-help">按住 · 松开</span><i id="charge-fill"></i></button><div class="keyboard-hint">点击海面亦可操作 <span>·</span> 键盘 SPACE</div></footer></main><script type="module" src="game.js"></script></body></html>
