<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <title>小小货运站 · 推箱子</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="station">
    <header class="mast">
      <div class="brand"><span class="carton" aria-hidden="true"><i></i></span><h1>小小货运站</h1></div>
      <button class="help-button" id="help" type="button"><span aria-hidden="true">?</span> 玩法</button>
    </header>
    <div class="layout">
      <section class="play" aria-labelledby="level-name">
        <div class="board-head">
          <div>
            <div class="level-number" id="level-number"></div>
            <h2 id="level-name"></h2>
          </div>
          <div class="counter-group" aria-label="关卡进度">
            <div><small>步数</small><strong id="moves">0</strong></div>
            <div><small>已归位</small><strong id="delivered">0 / 1</strong></div>
          </div>
        </div>
        <div class="board-frame"><canvas id="board" role="img" tabindex="0" aria-describedby="instruction"></canvas></div>
      </section>
      <section class="control-panel" aria-label="操作">
        <div class="task">
          <div class="goal-mark" aria-hidden="true">◎</div>
          <div><h3 id="task-title">货运任务</h3><p id="instruction">把木箱推到绿色货位。</p></div>
        </div>
        <button id="next" class="next" hidden type="button"></button>
        <div class="control-body">
          <div class="pad" role="group" aria-label="移动方向">
            <button data-dir="up" aria-label="向上移动" type="button"></button>
            <button data-dir="left" aria-label="向左移动" type="button"></button>
            <span class="pad-center" aria-hidden="true"></span>
            <button data-dir="right" aria-label="向右移动" type="button"></button>
            <button data-dir="down" aria-label="向下移动" type="button"></button>
          </div>
          <div class="actions">
            <button id="undo" type="button"><span aria-hidden="true">↶</span> 撤销</button>
            <button id="restart" type="button"><span aria-hidden="true">⟳</span> 重来</button>
          </div>
        </div>
        <p class="input-hint" id="hint">方向键 / WASD 移动</p>
      </section>
    </div>
    <p class="sr-only" id="announce" role="status"></p>
  </main>
  <dialog id="guide">
    <h2>货运站玩法</h2>
    <p>让搬运员走到木箱后面，把每只箱子推到绿色货位。一次只能推一只，碰到墙或另一只箱子就得换个方向。</p>
    <p>滑动画面、点方向按钮，或用方向键和 WASD 移动。按 Z 撤销一步，R 重新开始本关。</p>
    <form method="dialog"><button class="next" autofocus>回到货运站</button></form>
  </dialog>
  <script type="module" src="./game.js"></script>
</body>
</html>
