<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小满菜园 · 动作比较</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eee9dc;color:#285941;font-family:sans-serif}h1{font-size:24px}p{font-size:13px;line-height:1.8}a{color:inherit}main{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;flex:1;min-width:180px;max-width:390px}img{width:100%;height:auto;display:block}figcaption{font-size:12px;line-height:1.8;margin:10px 0}nav{margin:20px 0;display:flex;gap:25px;flex-wrap:wrap}</style><h1>从棋盘，到收获篮</h1><p>同一局面，2 ↔ 9 交换。直接收纳更短促；飞行版让作物从匹配位置抵达篮子，停下之后仍保留收获。</p><nav><a href="../skill/?study=direct">试玩A · 直接收纳</a><a href="../skill/">试玩B · 飞行落篮（采用）</a><a href="style-comparison.html">造型比较</a></nav><main><figure><img src="action-contact.png" alt="匹配的胡萝卜离开格子"><figcaption>接触：匹配作物提起，周围作物保持稳定。</figcaption></figure><figure><img src="action-travel.png" alt="胡萝卜正在向篮子移动"><figcaption>传递：因果从匹配位置向下移动。</figcaption></figure><figure><img src="action-rest.png" alt="三根胡萝卜已经落入收获篮"><figcaption>结果：篮子留下三根胡萝卜，棋盘落稳。</figcaption></figure><figure><img src="action-direct.png" alt="直接收纳版本，同样留下三根胡萝卜"><figcaption>对照：直接收纳也保留结果，省去飞行。</figcaption></figure></main></html>
