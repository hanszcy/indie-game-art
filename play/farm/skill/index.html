<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5e6"><link rel="icon" href="data:,"><title>小满菜园 · 消消乐</title><link rel="stylesheet" href="./style.css?v=3.2.0">
</head>
<body>
<main class="atelier">
  <nav class="navigation" aria-label="游戏导航">
    <a class="back" href="../index.html" aria-label="返回游戏展架"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="m13 3 3 3-6 5 12-1v4l-12-1 6 6-3 3L2 12Z"/></svg></a>
    <span class="edition">菜 园 · 第 一 季</span>
    <button id="sound" class="sound" type="button" aria-label="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="m3 9 5-1 7-5-1 18-6-5-5-1Z"/><path class="sound-on" d="M18 7q5 5 0 10" stroke-width="2.5"/><path class="sound-off" d="m18 9 5 6m0-6-5 6" stroke-width="2.2"/></svg></button>
  </nav>
  <header class="identity">
    <div class="sun" aria-hidden="true"><svg viewBox="0 0 70 70"><path d="m35 0 4 15 12-9-3 15 17-1-12 11 17 6-17 5 10 13-16-3 1 17-12-12-7 13-3-17-15 6 7-15-17-3 15-8L4 22l17 1-1-17 11 12Z" fill="#dd7042"/><path d="M27 30v5m15-5v5m-14 7q8 6 15-2" fill="none" stroke="#fbf5e6" stroke-width="2.3" stroke-linecap="round"/></svg></div>
    <div><h1><span>小</span><span>满</span><span>菜</span><span>园</span></h1><p class="subtitle">摘一点，满一篮。</p></div>
    <span class="season-mark" aria-hidden="true">应<br>季<br>鲜<br>摘</span>
  </header>
  <section class="work" aria-label="农场菜地">
    <div class="ledger">
      <div class="score-ledger"><span class="ledger-label">收获</span><div class="score-line"><strong id="score">0</strong><span> / <span id="target">1800</span></span></div></div>
      <div class="move-ledger"><strong id="moves">24</strong><span class="ledger-label">步可交换</span></div>
    </div>
    <div id="progress" class="progress" role="progressbar" aria-label="收获目标进度" aria-valuemin="0" aria-valuemax="1800" aria-valuenow="0"><span></span></div>
    <div class="field-edge" aria-hidden="true"></div>
    <div id="board" class="board" aria-busy="true"><canvas id="art" aria-hidden="true"></canvas><div id="cells" class="cells" role="group" aria-label="七行七列作物。方向键移动焦点，回车选中两件相邻作物，或手指轻扫交换。"></div></div>
    <p id="status" class="status" role="status" aria-live="polite">正在整理菜地…</p>
    <div class="harvest-dock" aria-label="收获与农具">
      <button id="hint" class="garden-tool hint-tool" type="button" disabled><svg class="tool-art" viewBox="0 0 88 76" aria-hidden="true"><ellipse class="tool-shadow" cx="43" cy="69" rx="25" ry="3" fill="#d9d1b8"/><g class="tool-face"><path fill="#b76c3c" d="m46 45 8-6 23 23-1 7-7 2Z"/><path fill="#e4a55b" d="m54 46 3-3 17 19-3 3Z"/><path fill="#285941" d="M14 17 29 7 47 10 59 23 58 40 47 53 29 55 14 45 9 31Z"/><path fill="#f1e5bb" d="m20 22 11-8 13 3 9 10-1 11-9 9-12 1-11-8-3-10Z"/><path fill="#7d9a56" d="M32 39Q16 36 23 23q16 1 9 16m3 0q-2-17 13-15 1 13-13 15"/><path d="m31 44 8-14" stroke="#285941" stroke-width="2"/><path d="m15 10 1-5m-8 11-5-1m42-8 3-4" stroke="#d7a447" stroke-width="2.5"/></g></svg><span class="tool-label">找一组</span></button>
      <div class="harvest-center"><div class="basket"><div id="receiver" class="basket-crops" aria-hidden="true"></div><div class="basket-front" aria-hidden="true"></div></div><span class="basket-caption">今日鲜摘</span></div>
      <button id="restart" class="garden-tool seed-tool" type="button" disabled><svg class="tool-art" viewBox="0 0 88 76" aria-hidden="true"><ellipse class="tool-shadow" cx="45" cy="69" rx="25" ry="3" fill="#d9d1b8"/><g class="tool-face"><path fill="#b56c3e" d="m21 10 42-4 6 59-43 6Z"/><path fill="#dfac68" d="m18 9 43-4 5 57-43 5Z"/><path fill="#efc885" d="m18 9 21 8 22-12-2 14-39 4Z"/><path fill="#fff6dd" d="m25 26 30-3 3 28-30 4Z"/><path fill="#44805a" d="m39 47-2-14 4-1 2 14Zm0-7Q25 41 30 29q12 1 9 11m3-5q0-13 12-10 0 11-12 10"/><path d="M31 57q14 6 24-4m-1 6 2-7-7 1" fill="none" stroke="#a54d38" stroke-width="2.5"/></g></svg><span class="tool-label">再种一季</span></button>
    </div>
    <p class="instructions">滑动交换 · 相同作物连成三个即可收获</p>
  </section>
  <dialog id="result" aria-labelledby="result-title"><button id="close-result" class="close-result" type="button" aria-label="关闭结果，查看菜地"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 13 14M18 5 5 18"/></svg></button><div class="result-basket" aria-hidden="true"></div><p class="result-eyebrow">小 满 菜 园 · 今 日 收 成</p><h2 id="result-title"></h2><p id="result-copy"></p><div class="result-score"><strong id="result-score"></strong><span>收获积分</span></div><button id="play-again" class="play-again" type="button"><svg class="tool-art" viewBox="0 0 88 76" aria-hidden="true"><ellipse class="tool-shadow" cx="45" cy="69" rx="25" ry="3" fill="#d9d1b8"/><g class="tool-face"><path fill="#b56c3e" d="m21 10 42-4 6 59-43 6Z"/><path fill="#dfac68" d="m18 9 43-4 5 57-43 5Z"/><path fill="#efc885" d="m18 9 21 8 22-12-2 14-39 4Z"/><path fill="#fff6dd" d="m25 26 30-3 3 28-30 4Z"/><path fill="#44805a" d="m39 47-2-14 4-1 2 14Zm0-7Q25 41 30 29q12 1 9 11m3-5q0-13 12-10 0 11-12 10"/><path d="M31 57q14 6 24-4m-1 6 2-7-7 1" fill="none" stroke="#a54d38" stroke-width="2.5"/></g></svg><span>再种一季</span></button></dialog>
</main>
<script type="module" src="./app.js"></script>
</body></html>
