<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eff5da"><title>晴天小菜园 · 农场三消</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="game">
  <nav><a href="../index.html" aria-label="返回版本选择">‹ <span>小菜园</span></a><span class="day">晴天 · 宜收获 <i></i></span></nav>
  <header><p class="eyebrow">SUNNY LITTLE FARM</p><h1>晴天小菜园</h1><p class="subtitle">把好心情，装进菜篮里。</p>
    <svg class="farm" viewBox="0 0 380 115" aria-hidden="true"><circle cx="315" cy="26" r="18" fill="#f7d578"/><path d="M0 72Q90 12 182 65T380 47V115H0Z" fill="#d2df9e"/><path d="M0 93Q100 42 219 90T380 76V115H0Z" fill="#aebe76"/><path d="M265 52h58v48h-58Z" fill="#dc9870"/><path d="m255 53 39-32 38 32Z" fill="#bc6e51"/><path d="M279 71h27v29h-27Z" fill="#f9e7be"/><path d="M292 73v26m-12-25 25 24m0-24-25 24" stroke="#c18461" stroke-width="2"/><path d="M35 82V60m17 22V60m17 22V60M26 67h51m-51 10h51" stroke="#f8edca" stroke-width="5"/><path d="M100 109q0-20 18-18m-18 18q-2-16-15-17m51 17q0-20 18-18m-18 18q-2-16-15-17m51 17q0-20 18-18m-18 18q-2-16-15-17" stroke="#748f49" stroke-width="4" fill="none"/></svg>
  </header>
  <section class="score-card" aria-label="本局进度"><div class="score-line"><div><span class="caption">丰收进度</span><p><strong id="score">0</strong><span class="target"> / 1,800</span></p></div><div class="moves"><strong id="moves">24</strong><span>剩余步数</span></div></div><div id="progress" class="progress" role="progressbar" aria-label="丰收进度" aria-valuemin="0" aria-valuemax="1800" aria-valuenow="0"><div id="progress-fill"></div></div></section>
  <section class="plot"><div class="plot-label"><span>第一块菜地</span><span>连成 3 个 · 一起收获</span></div><div class="board-wrap"><div id="board" role="grid" aria-label="七行七列蔬菜消除棋盘" aria-rowcount="7" aria-colcount="7"></div><div id="points-pop" aria-hidden="true"></div><section id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden><div class="result-card"><div id="result-icon"></div><p id="result-eyebrow"></p><h2 id="result-title"></h2><p id="result-description"></p><button id="play-again" type="button">再收获一篮</button></div></section></div></section>
  <p id="message" class="message">交换相邻蔬菜，连成 3 个即可收获</p>
  <div class="actions"><button id="hint" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 15C2 9 6 3 12 3s10 6 4 12l-1 3H9Zm1 6h6M12 0v1M2 5l2 1m16 0 2-1"/></svg>找找灵感 <kbd>H</kbd></button><button id="restart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 7M4 3v6h6"/></svg>重新开始 <kbd>R</kbd></button></div>
  <footer>轻轻滑动，或点选两颗相邻蔬菜</footer><div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main><script type="module" src="app.js"></script>
</body></html>
