<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a4cabe">
<title>糖花工房 · 糖果三消</title>
<link rel="stylesheet" href="./workshop.css">
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="bulb" viewBox="0 0 24 24"><path d="M8.5 16c0-2.4-3.2-3.5-3.2-7A6.7 6.7 0 0 1 18.7 9c0 3.5-3.2 4.6-3.2 7zM9 19h6m-5 2h4m-2-6v-4m-2-1 2 1 2-1"/></symbol>
<symbol id="restart" viewBox="0 0 24 24"><path d="M5 10a7.5 7.5 0 1 1 .5 6M5 4v6h6"/></symbol>
</defs></svg>
<main class="bench">
 <aside class="slip" aria-label="本炉糖果订单">
  <div class="slip-content">
   <header class="identity">
    <svg class="maker" viewBox="0 0 142 58" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
     <g opacity=".8"><path d="M7 37c11-6 14-3 22-7m-18 12c13-3 17-2 23-7M114 30c9-2 13 3 21 7m-26-2c9 2 14 5 22 7"/></g>
     <path d="m42 20 12 1c6-8 25-14 34-7l8-7 10 1-5 10 5 4-15 3c-5 11-22 16-34 10l-8 8-10 1 5-12-7-5 10-2z" fill="currentColor" stroke="none"/>
     <g stroke="var(--paper)" stroke-width="1.4"><path d="M59 30c3-9 10-13 16-15m-8 18c1-8 11-15 16-16m-9 15c3-4 7-8 12-10M47 24l8 1m-10 9 9-5m38-9 7-1m-9-1 6-5"/></g>
     <path d="M55 40c8 3 19 3 29-4"/></svg>
    <div><h1>糖花工房</h1><p lang="en">Sugar Works</p></div>
   </header>
   <div class="batch"><span>第 <strong id="level">01</strong> 炉</span><i></i><h2 id="order-title">莓果开张</h2></div>
   <section class="order" aria-labelledby="order-label"><h3 id="order-label">本炉订单</h3><div id="goals" aria-label="收集目标"></div></section>
   <div class="numbers">
    <div class="gauge"><span>剩余步数</span><strong id="moves" aria-label="剩余步数">13</strong></div>
    <div class="score-box"><span>得分</span><strong id="score" aria-label="得分">0</strong></div>
   </div>
  </div>
 </aside>
 <section class="work" aria-label="冷糖模盘">
  <div class="tray">
   <div class="tin"><div id="board" role="group" aria-label="七行七列糖盘，方向键移动，回车选糖或交换">
    <div class="sweets" id="sweets" aria-hidden="true"></div>
    <div class="shards" id="shards" aria-hidden="true"></div>
    <div class="sockets" id="sockets"></div>
   </div></div>
   <div id="receipt" class="receipt" role="region" aria-label="本炉结算" hidden>
    <span class="receipt-rule"></span><h2 id="stamp"></h2><p id="reason"></p><button id="next" type="button"></button>
   </div>
  </div>
  <div class="tools">
   <p id="status" role="status" aria-live="polite">点选或滑动，三颗同色即消。</p>
   <div class="buttons"><button id="sound" type="button" aria-label="音效" aria-pressed="false" title="开启音效"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="wave" d="M15 9c2 1.5 2 4.5 0 6m3-9c4 3 4 9 0 12"/><path class="mute" d="m16 10 5 5m0-5-5 5"/></svg></button><button id="hint" type="button"><svg aria-hidden="true"><use href="#bulb"/></svg>提示</button><button id="retry" type="button"><svg aria-hidden="true"><use href="#restart"/></svg>重开</button></div>
  </div>
  <p class="keys"><span>方向键移动 · 回车选糖</span></p>
 </section>
</main>
<script src="../engine.js"></script>
<script src="./workshop.js"></script>
</body>
</html>
