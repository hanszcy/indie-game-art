<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14252f" />
    <title>Wickwatch · Tower Defense</title>
    <link rel="stylesheet" href="../watch.css" />
  </head>
  <body data-edition="lantern">
    <main>
      <nav>
        <a id="repo" href="https://github.com/hanszcy/indie-game-art"
          >Indie Game Art</a
        >
        <div>
          <a id="sister"></a
          ><select aria-label="Language" id="language">
            <option value="en">English</option>
            <option value="zh">简体中文</option>
            <option value="ja">日本語</option>
          </select>
        </div>
      </nav>
      <header>
        <span class="lampmark" aria-hidden="true"><i></i></span>
        <div>
          <span id="edition"></span>
          <h1></h1>
        </div>
      </header>
      <section class="console">
        <div class="playfield">
          <div class="hud">
            <span id="wave"></span><span id="light"></span
            ><span id="gold"></span>
          </div>
          <div id="field">
            <canvas
              id="map"
              width="384"
              height="228"
              aria-hidden="true"
            ></canvas>
            <div id="pads" role="group"></div>
          </div>
          <div class="ribbon" role="status" id="notice"></div>
        </div>
        <aside>
          <div id="armory"></div>
          <div id="towers"></div>
          <div class="buttons">
            <button id="start"></button><button id="pause"></button
            ><button id="guide">?</button>
          </div>
        </aside>
      </section>
    </main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div class="seal" aria-hidden="true"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="choices"></div>
    </dialog>
    <script src="../locale.js"></script>
    <script src="../engine.js"></script>
    <script src="../paint.js"></script>
    <script src="../ui.js"></script>
  </body>
</html>
