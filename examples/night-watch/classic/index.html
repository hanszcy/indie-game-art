<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a474c" />
    <link rel="stylesheet" href="../watch.css" />
    <title>Harbor Hands</title>
  </head>
  <body data-edition="classic">
    <main>
      <nav>
        <a href="https://github.com/hanszcy/indie-game-art">Indie Game Art</a>
        <div>
          <a id="sister"></a
          ><select id="language" aria-label="Language">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </div>
      </nav>
      <article>
        <header>
          <div>
            <small id="edition"></small>
            <h1></h1>
          </div>
          <div class="headtools">
            <button id="guide">?</button><button id="pause">Ⅱ</button>
          </div>
        </header>
        <section id="field">
          <canvas id="map" width="640" height="640" aria-hidden="true"></canvas>
          <div id="muster" aria-hidden="true"></div>
          <div class="meters">
            <span id="wave"></span><span class="money" id="gold"></span>
          </div>
          <div id="wall"></div>
        </section>
        <section class="deck"><div id="pads" role="group"></div></section>
        <div id="notice" role="status"></div>
        <footer>
          <button id="upgrade"><i></i><span></span><b></b></button
          ><button id="summon"><i></i><span></span><b></b></button>
        </footer>
      </article>
    </main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div id="choices"></div>
    </dialog>
    <script src="../locale.js"></script>
    <script src="../engine.js"></script>
    <script src="../paint.js"></script>
    <script src="../ui.js"></script>
  </body>
</html>
