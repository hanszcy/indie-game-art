<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 484" width="640" height="484" role="img" aria-labelledby="title desc">
  <title id="title">One heron, two stances</title>
  <desc id="desc">The reed stalker has a long, bent neck and raises one leg. The spring fisher folds its neck over a round crouched body. Each bird appears twice at play size. Below, the spring fisher holds, lunges, and settles around the same planted toes.</desc>
